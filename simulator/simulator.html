<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS SAA-C03 Exam Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #0a0e27;
  color: #e0e0e0;
  min-height: 100vh;
}
.container { max-width: 920px; margin: 0 auto; padding: 20px; }
.header {
  text-align: center; padding: 30px 0 20px;
  border-bottom: 1px solid #1a1f4e; margin-bottom: 30px;
}
.header h1 {
  font-size: 1.8em;
  background: linear-gradient(135deg, #ff9900, #ffb84d);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  margin-bottom: 8px;
}
.header p { color: #8888aa; font-size: 0.95em; }
.lang-switch {
  position: absolute; top: 20px; right: 20px;
  display: flex; gap: 4px; background: #12163a;
  border-radius: 8px; padding: 4px; border: 1px solid #1a1f4e;
}
.lang-btn {
  padding: 6px 14px; border: none; border-radius: 6px;
  cursor: pointer; font-size: 0.85em; background: transparent; color: #888;
  transition: all 0.2s;
}
.lang-btn.active { background: #ff9900; color: #000; font-weight: 600; }
.lang-btn:hover:not(.active) { color: #ccc; }
</style>
</head>
<body>
<div style="position:relative;">
  <div class="lang-switch">
    <button class="lang-btn active" onclick="setLang('en')">🇬🇧 EN</button>
    <button class="lang-btn" onclick="setLang('it')">🇮🇹 IT</button>
  </div>
</div>
<div class="container">

  </div>

</div>

.menu { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:30px; }

// ===== CATEGORY NORMALIZATION =====

<script>
// ===== STATE =====
let QUESTIONS_EN = [];
let QUESTIONS_IT = [];
let ALL_QUESTIONS = []; // active language questions
let lang = 'en';
let itAvailable = false;
let state = {
  view: 'menu',
  questions: [],    // current quiz questions (indices into ALL_QUESTIONS)
  qIndices: [],     // original indices to map between EN/IT
  currentIndex: 0,
  answers: {},
  confirmed: {},
  score: 0,
  startTime: null,
  elapsed: 0,
  timerInterval: null,
  config: { sources: [], categories: [], count: 65, shuffle: true, timed: true, timeLimit: 130 }
};

function t(key) { return T[lang][key] || T['en'][key] || key; }

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent.includes(l.toUpperCase()));
  });
  ALL_QUESTIONS = (l === 'it' && itAvailable) ? QUESTIONS_IT : QUESTIONS_EN;
  // Remap current quiz questions to new language (same indices)
  if (state.qIndices.length > 0) {
    state.questions = state.qIndices.map(i => ALL_QUESTIONS[i]);
  }
  render();
}

function prepareQuestions(data) {
  return data.filter(q => q.answers.length >= 2 && q.has_correct)
    .map(q => { q.category = normCat(q.category || 'Unknown'); return q; });
}

// Load both files at startup
const app = document.getElementById('app');
app.innerHTML = '<p style="text-align:center;color:#888;padding:40px;">⏳ Loading...</p>';

fetch('questions.json')
  .then(r => r.json())
  .then(data => {
    QUESTIONS_EN = prepareQuestions(data);
    ALL_QUESTIONS = QUESTIONS_EN;
    console.log(`EN: ${QUESTIONS_EN.length} questions`);
    render();
    // Load IT in background
    return fetch('questions_it.json').then(r => r.ok ? r.json() : null).catch(() => null);
  })
  .then(dataIt => {
    if (dataIt) {
      QUESTIONS_IT = prepareQuestions(dataIt);
      itAvailable = true;
      console.log(`IT: ${QUESTIONS_IT.length} questions`);
      if (lang === 'it') { ALL_QUESTIONS = QUESTIONS_IT; render(); }
    }
  })
  .catch(e => {
    app.innerHTML = `<p style="color:#ef4444;text-align:center;">Error: ${e.message}</p>`;
  });

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getCategories() {
  const cats = {};
  ALL_QUESTIONS.forEach(q => { cats[q.category] = (cats[q.category] || 0) + 1; });
  return Object.entries(cats).sort((a, b) => b[1] - a[1]);
}

function getSources() {
  return [...new Set(ALL_QUESTIONS.map(q => q.source))].sort((a, b) => {
    return parseInt(a.split('-')[1]) - parseInt(b.split('-')[1]);
  });
}

function startQuiz() {
  // Build pool with original indices so we can remap on language switch
  let poolWithIdx = ALL_QUESTIONS.map((q, i) => ({ q, i }));
  if (state.config.sources.length > 0)
    poolWithIdx = poolWithIdx.filter(x => state.config.sources.includes(x.q.source));
  if (state.config.categories.length > 0)
    poolWithIdx = poolWithIdx.filter(x => state.config.categories.includes(x.q.category));
  if (state.config.shuffle) poolWithIdx = shuffle(poolWithIdx);
  poolWithIdx = poolWithIdx.slice(0, state.config.count);
  state.qIndices = poolWithIdx.map(x => x.i);
  state.questions = poolWithIdx.map(x => x.q);
  state.currentIndex = 0;
  state.answers = {};
  state.confirmed = {};
  state.score = 0;
  state.startTime = Date.now();
  state.elapsed = 0;
  state.view = 'quiz';
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    const el = document.getElementById('timer');
    if (!el) return;
    if (state.config.timed) {
      const rem = Math.max(0, state.config.timeLimit * 60 - state.elapsed);
      if (rem <= 0) { finishQuiz(); return; }
      el.textContent = `${String(Math.floor(rem/60)).padStart(2,'0')}:${String(rem%60).padStart(2,'0')}`;
    } else {
      el.textContent = `${String(Math.floor(state.elapsed/60)).padStart(2,'0')}:${String(state.elapsed%60).padStart(2,'0')}`;
    }
  }, 1000);
  render();
}

function finishQuiz() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  let correct = 0;
  state.questions.forEach((q, i) => {
    if (state.answers[i] !== undefined) {
      const sel = q.answers[state.answers[i]];
      if (sel && sel.correct) correct++;
    }
  });
  state.score = correct;
  state.view = 'results';
  render();
}

function render() {
  const app = document.getElementById('app');
  switch (state.view) {
    case 'menu': app.innerHTML = renderMenu(); break;
    case 'config': app.innerHTML = renderConfig(); break;
    case 'quiz': app.innerHTML = renderQuiz(); break;
    case 'results': app.innerHTML = renderResults(); break;
    case 'review': app.innerHTML = renderReview(); break;
  }
}
</script>
<script>
// ===== RENDER MENU =====
function renderMenu() {
  const cats = getCategories();
  const sources = getSources();
  return `
    <div class="config-panel">
      <h2>${t('startSim')}</h2>
      <p style="color:#888;margin-bottom:25px;">
        ${ALL_QUESTIONS.length} ${t('questionsAvailable')} ${sources.length} ${t('exerciseSets')}
      </p>
      <div class="menu">
        <button class="btn btn-primary" onclick="quickStart(65)">${t('fullExam')}</button>
        <button class="btn btn-secondary" onclick="quickStart(30)">${t('quick')}</button>
        <button class="btn btn-secondary" onclick="quickStart(10)">${t('miniTest')}</button>
        <button class="btn btn-secondary" onclick="state.view='config';render()">${t('customize')}</button>
      </div>

      <h3 style="color:#ff9900;margin:25px 0 15px;">${t('byCategory')}</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:25px;">
        ${cats.map(([cat, count]) => `
          <div class="cat-card" onclick="startByCategory('${cat}')">
            <div class="cat-icon">${CAT_ICONS[cat] || '📁'}</div>
            <div class="cat-name">${cat}</div>
            <div class="cat-count">${count} ${t('questions')}</div>
          </div>
        `).join('')}
      </div>

      <h3 style="color:#ff9900;margin:25px 0 15px;">${t('bySets')}</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;">
        ${sources.map(s => {
          const count = ALL_QUESTIONS.filter(q => q.source === s).length;
          return `<div class="cat-card" onclick="startFromSource('${s}')">
            <div style="color:#ff9900;font-weight:600;">${t('set')} ${s.split('-')[1]}</div>
            <div class="cat-count">${count} ${t('questions')}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function quickStart(count) {
  state.config.sources = [];
  state.config.categories = [];
  state.config.count = count;
  state.config.shuffle = true;
  state.config.timed = count >= 65;
  state.config.timeLimit = 130;
  startQuiz();
}

function startFromSource(source) {
  state.config.sources = [source];
  state.config.categories = [];
  state.config.count = 999;
  state.config.shuffle = false;
  state.config.timed = false;
  startQuiz();
}

function startByCategory(cat) {
  state.config.sources = [];
  state.config.categories = [cat];
  state.config.count = 999;
  state.config.shuffle = true;
  state.config.timed = false;
  startQuiz();
}

// ===== RENDER CONFIG =====
function renderConfig() {
  const sources = getSources();
  const cats = getCategories();
  return `
    <div class="config-panel">
      <h2>${t('config')}</h2>
      <div class="config-group">
        <label>${t('numQuestions')}</label>
        <input type="number" id="cfg-count" value="${state.config.count}" min="1" max="${ALL_QUESTIONS.length}">
      </div>
      <div class="config-group">
        <label>${t('categories')}</label>
        <div class="chip-group">
          ${cats.map(([cat, count]) => `
            <div class="chip ${state.config.categories.includes(cat)?'active':''}"
                 onclick="toggleCfgCat('${cat}')">
              ${CAT_ICONS[cat]||'📁'} ${cat} <span class="count">(${count})</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="config-group">
        <label>${t('exerciseSetsLabel')}</label>
        <div class="chip-group">
          ${sources.map(s => {
            const count = ALL_QUESTIONS.filter(q => q.source === s).length;
            return `<div class="chip ${state.config.sources.includes(s)?'active':''}"
                        onclick="toggleCfgSource('${s}')">
              ${t('set')} ${s.split('-')[1]} <span class="count">(${count})</span>
            </div>`;
          }).join('')}
        </div>
      </div>
      <div class="config-group" style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="cfg-shuffle" ${state.config.shuffle?'checked':''} style="width:auto;">
        <label for="cfg-shuffle" style="margin:0;">${t('shuffleQuestions')}</label>
      </div>
      <div class="config-group" style="display:flex;align-items:center;gap:10px;">
        <input type="checkbox" id="cfg-timed" ${state.config.timed?'checked':''} style="width:auto;"
               onchange="document.getElementById('cfg-time').style.display=this.checked?'flex':'none'">
        <label for="cfg-timed" style="margin:0;">${t('timerActive')}</label>
        <div id="cfg-time" style="display:${state.config.timed?'flex':'none'};align-items:center;gap:8px;margin-left:12px;">
          <input type="number" id="cfg-timelimit" value="${state.config.timeLimit}" min="1" style="width:80px;"> ${t('minutes')}
        </div>
      </div>
      <div class="nav-buttons">
        <button class="btn btn-secondary" onclick="state.view='menu';render()">${t('back')}</button>
        <button class="btn btn-primary" onclick="applyConfig()">${t('startSimulation')}</button>
      </div>
    </div>
  `;
}

function toggleCfgCat(cat) {
  const idx = state.config.categories.indexOf(cat);
  if (idx >= 0) state.config.categories.splice(idx, 1);
  else state.config.categories.push(cat);
  render();
}

function toggleCfgSource(source) {
  const idx = state.config.sources.indexOf(source);
  if (idx >= 0) state.config.sources.splice(idx, 1);
  else state.config.sources.push(source);
  render();
}

function applyConfig() {
  state.config.count = parseInt(document.getElementById('cfg-count').value) || 65;
  state.config.shuffle = document.getElementById('cfg-shuffle').checked;
  state.config.timed = document.getElementById('cfg-timed').checked;
  if (state.config.timed)
    state.config.timeLimit = parseInt(document.getElementById('cfg-timelimit').value) || 130;
  startQuiz();
}
</script>
<script>
// ===== RENDER QUIZ =====
function renderQuiz() {
  const q = state.questions[state.currentIndex];
  if (!q) return `<p>${t('questions')}: 0</p>`;
  const answered = state.answers[state.currentIndex] !== undefined;
  const confirmed = state.confirmed[state.currentIndex];
  const totalAnswered = Object.keys(state.confirmed).length;
  const progress = (totalAnswered / state.questions.length) * 100;

  return `
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value">${state.currentIndex + 1}/${state.questions.length}</div>
        <div class="stat-label">${t('question')}</div>
      </div>
      <div class="stat">
        <div class="stat-value">${totalAnswered}</div>
        <div class="stat-label">${t('answered')}</div>
      </div>
      <div class="stat">
        <div class="timer" id="timer">00:00</div>
        <div class="stat-label">${state.config.timed ? t('timeRemaining') : t('time')}</div>
      </div>
    </div>
    <div class="progress-container"><div class="progress-bar" style="width:${progress}%"></div></div>
    <div class="q-grid">
      ${state.questions.map((_, i) => {
        let cls = i === state.currentIndex ? 'current' : state.confirmed[i] ? 'answered' : '';
        return `<div class="q-grid-item ${cls}" onclick="goTo(${i})">${i+1}</div>`;
      }).join('')}
    </div>
    <div class="question-card">
      <span class="q-number">${t('question')} ${state.currentIndex + 1}</span>
      <span class="q-source">${t('set')} ${q.source.split('-')[1]}</span>
      <span class="q-category">${CAT_ICONS[q.category]||'📁'} ${q.category}</span>
      <p class="q-text">${q.question}</p>
      <div class="answers">
        ${q.answers.map((a, i) => {
          const letter = String.fromCharCode(65 + i);
          let cls = '';
          if (confirmed) {
            if (a.correct) cls = 'correct show-correct';
            else if (state.answers[state.currentIndex] === i) cls = 'incorrect';
            cls += ' disabled';
          } else if (state.answers[state.currentIndex] === i) cls = 'selected';
          return `
            <div class="answer-option ${cls}" onclick="${confirmed ? '' : `selectAns(${i})`}">
              <div class="answer-letter">${letter}</div>
              <div>
                <div class="answer-text">${a.text}</div>
                <div class="answer-exp ${confirmed ? 'visible' : ''}">${a.explanation || ''}</div>
              </div>
            </div>`;
        }).join('')}
      </div>
      <div class="explanation-box ${confirmed ? 'visible' : ''}">
        <h4>${t('explanation')}</h4>
        <p>${q.overall_explanation || t('noExplanation')}</p>
      </div>
    </div>
    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="goTo(${state.currentIndex-1})" ${state.currentIndex===0?'disabled':''}>${t('previous')}</button>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        ${!confirmed && answered ? `<button class="btn btn-primary" onclick="confirmAns()">${t('confirm')}</button>` : ''}
        ${confirmed && state.currentIndex < state.questions.length-1 ?
          `<button class="btn btn-primary" onclick="goTo(${state.currentIndex+1})">${t('next')}</button>` : ''}
        ${Object.keys(state.confirmed).length > 0 ?
          `<button class="btn btn-danger" onclick="if(confirm('${t('finishConfirm')}'))finishQuiz()">${t('finish')}</button>` : ''}
      </div>
      <button class="btn btn-secondary" onclick="goTo(${state.currentIndex+1})" ${state.currentIndex>=state.questions.length-1?'disabled':''}>${t('next')}</button>
    </div>
  `;
}

function selectAns(i) { if (!state.confirmed[state.currentIndex]) { state.answers[state.currentIndex]=i; render(); } }
function confirmAns() { state.confirmed[state.currentIndex]=true; render(); }
function goTo(i) { if (i>=0 && i<state.questions.length) { state.currentIndex=i; render(); } }

// ===== RENDER RESULTS =====
function renderResults() {
  const total = state.questions.length;
  const answered = Object.keys(state.confirmed).length;
  const pct = total > 0 ? Math.round((state.score / total) * 100) : 0;
  const pass = pct >= 72;
  const mins = Math.floor(state.elapsed / 60);
  const secs = state.elapsed % 60;

  // Category breakdown
  const catStats = {};
  state.questions.forEach((q, i) => {
    if (!catStats[q.category]) catStats[q.category] = { total: 0, correct: 0 };
    catStats[q.category].total++;
    if (state.confirmed[i] && state.answers[i] !== undefined) {
      const sel = q.answers[state.answers[i]];
      if (sel && sel.correct) catStats[q.category].correct++;
    }
  });

  return `
    <div class="results-panel">
      <h2>${t('results')}</h2>
      <div class="score-circle ${pass?'pass':'fail'}">
        ${pct}%
        <small>${pass ? t('passed') : t('failed')}</small>
      </div>
      <div class="results-stats">
        <div class="results-stat"><div class="results-stat-value green">${state.score}</div><div class="results-stat-label">${t('correct')}</div></div>
        <div class="results-stat"><div class="results-stat-value red">${answered - state.score}</div><div class="results-stat-label">${t('wrong')}</div></div>
        <div class="results-stat"><div class="results-stat-value yellow">${total - answered}</div><div class="results-stat-label">${t('unanswered')}</div></div>
        <div class="results-stat"><div class="results-stat-value" style="color:#ccc;">${mins}m ${secs}s</div><div class="results-stat-label">${t('time')}</div></div>
      </div>
      <p style="color:#888;margin:15px 0;">${t('passingScore')}</p>

      <h3 style="color:#ff9900;margin:25px 0 15px;">${t('categoryPerformance')}</h3>
      <div class="cat-results">
        ${Object.entries(catStats).sort((a,b)=>b[1].total-a[1].total).map(([cat, s]) => {
          const cpct = s.total > 0 ? Math.round((s.correct/s.total)*100) : 0;
          const color = cpct >= 72 ? '#22c55e' : cpct >= 50 ? '#ff9900' : '#ef4444';
          return `<div class="cat-result-item">
            <div class="cat-result-name">${CAT_ICONS[cat]||'📁'} ${cat}</div>
            <div class="cat-result-score" style="color:${color}">${cpct}% <span style="font-size:0.7em;color:#888">(${s.correct}/${s.total})</span></div>
            <div class="cat-result-bar"><div class="cat-result-fill" style="width:${cpct}%;background:${color}"></div></div>
          </div>`;
        }).join('')}
      </div>

      <div class="nav-buttons" style="justify-content:center;margin-top:25px;">
        <button class="btn btn-primary" onclick="state.view='review';render()">${t('reviewAnswers')}</button>
        <button class="btn btn-secondary" onclick="state.view='menu';render()">${t('menu')}</button>
      </div>
      <div class="q-grid" style="margin-top:25px;">
        ${state.questions.map((q, i) => {
          let cls = '';
          if (state.confirmed[i]) {
            const sel = q.answers[state.answers[i]];
            cls = sel && sel.correct ? 'correct-review' : 'incorrect-review';
          }
          return `<div class="q-grid-item ${cls}" onclick="reviewQ(${i})">${i+1}</div>`;
        }).join('')}
      </div>
    </div>
  `;
}

function reviewQ(i) { state.currentIndex = i; state.view = 'review'; render(); }

// ===== RENDER REVIEW =====
function renderReview() {
  const q = state.questions[state.currentIndex];
  if (!q) return '';
  const ua = state.answers[state.currentIndex];
  const wasCorrect = ua !== undefined && q.answers[ua] && q.answers[ua].correct;

  return `
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value">${state.currentIndex+1}/${state.questions.length}</div>
        <div class="stat-label">${t('review')}</div>
      </div>
      <div class="stat">
        <div class="stat-value" style="color:${wasCorrect?'#22c55e':'#ef4444'}">${wasCorrect ? '✓ '+t('correct') : '✗ '+t('wrong')}</div>
        <div class="stat-label">${t('answer')}</div>
      </div>
    </div>
    <div class="q-grid">
      ${state.questions.map((qq, i) => {
        let cls = i === state.currentIndex ? 'current' : '';
        if (!cls && state.confirmed[i]) {
          const sel = qq.answers[state.answers[i]];
          cls = sel && sel.correct ? 'correct-review' : 'incorrect-review';
        }
        return `<div class="q-grid-item ${cls}" onclick="reviewQ(${i})">${i+1}</div>`;
      }).join('')}
    </div>
    <div class="question-card">
      <span class="q-number">${t('question')} ${state.currentIndex+1}</span>
      <span class="q-source">${t('set')} ${q.source.split('-')[1]}</span>
      <span class="q-category">${CAT_ICONS[q.category]||'📁'} ${q.category}</span>
      <p class="q-text">${q.question}</p>
      <div class="answers">
        ${q.answers.map((a, i) => {
          const letter = String.fromCharCode(65 + i);
          let cls = 'disabled';
          if (a.correct) cls += ' correct show-correct';
          else if (ua === i) cls += ' incorrect';
          return `
            <div class="answer-option ${cls}">
              <div class="answer-letter">${letter}</div>
              <div>
                <div class="answer-text">${a.text}</div>
                <div class="answer-exp visible">${a.explanation || ''}</div>
              </div>
            </div>`;
        }).join('')}
      </div>
      <div class="explanation-box visible">
        <h4>${t('explanation')}</h4>
        <p>${q.overall_explanation || t('noExplanation')}</p>
      </div>
    </div>
    <div class="nav-buttons">
      <button class="btn btn-secondary" onclick="reviewQ(${state.currentIndex-1})" ${state.currentIndex===0?'disabled':''}>${t('previous')}</button>
      <button class="btn btn-primary" onclick="state.view='results';render()">${t('results')}</button>
      <button class="btn btn-secondary" onclick="reviewQ(${state.currentIndex+1})" ${state.currentIndex>=state.questions.length-1?'disabled':''}>${t('next')}</button>
    </div>
  `;
}
</script>
</body>
</html>
